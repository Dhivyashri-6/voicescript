<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Script - Transforming India's Oral Tradition</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="https://th.bing.com/th/id/OIP.rL_rED1XSv-5uSqxR7_ZUgHaHa?w=178&h=180&c=7&r=0&o=5&dpr=1.3&pid=1.7">
</head>
<body>
  
  <nav>
    <h1>Voice Script - Transforming India's Oral Tradition</h1>
  </nav>

  <div class="container">
    <h1>Speech to Text and Translation</h1>
    
    <form id="uploadForm" enctype="multipart/form-data">
      <label for="audioFile">Upload an Audio File 📁:</label>
      <input type="file" id="audioFile" name="audio" accept="audio/*" required>
      
      <label for="language">Input Language:</label>
      <select id="language" name="language" required>
        <option value="hi-IN">Hindi</option>
        <option value="en-IN">Indian English</option>
        <option value="ur-IN">Urdu</option>
        <option value="bn-IN">Bengali</option>
        <option value="pa-IN">Punjabi</option>
        <option value="ta-IN">Tamil</option>
        <option value="te-IN">Telugu</option>
        <option value="kn-IN">Kannada</option>
        <option value="ml-IN">Malayalam</option>
      </select>
      
      <button type="button" id="uploadBtn">Transcribe and Translate</button>
    </form>

    <div id="recordingSection">
      <center> 
        <button type="button" id="startRecord">Start Recording</button>
      </center>
      <center>
        <button type="button" id="stopRecord" disabled>Stop Recording</button>
      </center>
    </div>

    <div id="results" style="display: none;">
      <h2>Results</h2>
      <p><strong>Transcription:</strong> <span id="transcription"></span></p>
      <p><strong>Translation:</strong> <span id="translation"></span></p>
      <a id="downloadLink" href="#" style="display: none;" download>Download Translated Text</a>
      <center><button id="readTranslation" style="margin-top: 15px;">Read Out</button></center>
    </div>
  </div>

  <script>
    document.getElementById('uploadBtn').addEventListener('click', function() {
      const form = document.getElementById('uploadForm');
      const formData = new FormData(form);
      const audioFile = document.getElementById('audioFile').files[0];
      const language = document.getElementById('language').value;

      if (!audioFile || !language) {
        alert("Please upload an audio file and select a language.");
        return;
      }

      const uploadButton = document.getElementById('uploadBtn');
      uploadButton.disabled = true;
      uploadButton.innerText = 'Processing...';

      // Create the POST request to send the audio file and language to the server
      fetch('/upload', {
        method: 'POST',
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        if (data.error) {
          alert(data.error);
        } else {
          document.getElementById('transcription').innerText = data.transcription;
          document.getElementById('translation').innerText = data.translation;
          document.getElementById('downloadLink').href = data.download_link;
          document.getElementById('downloadLink').style.display = 'inline';
          document.getElementById('results').style.display = 'block';
        }
        uploadButton.disabled = false;
        uploadButton.innerText = 'Transcribe and Translate';
      })
      .catch(error => {
        alert('Error: ' + error);
        uploadButton.disabled = false;
        uploadButton.innerText = 'Transcribe and Translate';
      });
    });

    // Handling the speech-to-text recording
    const startRecordButton = document.getElementById('startRecord');
    const stopRecordButton = document.getElementById('stopRecord');

    let recorder;
    let audioStream;

    startRecordButton.addEventListener('click', () => {
      startRecordButton.disabled = true;
      stopRecordButton.disabled = false;

      // Request microphone access
      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(stream => {
          audioStream = stream;
          recorder = new MediaRecorder(stream);
          const audioChunks = [];

          recorder.ondataavailable = event => {
            audioChunks.push(event.data);
          };

          recorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
            const audioUrl = URL.createObjectURL(audioBlob);
            const audioFile = new File([audioBlob], 'recorded_audio.wav', { type: 'audio/wav' });

            // Send audio file to server for transcription
            const formData = new FormData();
            formData.append('audio', audioFile);
            formData.append('language', document.getElementById('language').value);

            fetch('/upload', {
              method: 'POST',
              body: formData
            })
            .then(response => response.json())
            .then(data => {
              if (data.error) {
                alert(data.error);
              } else {
                document.getElementById('transcription').innerText = data.transcription;
                document.getElementById('translation').innerText = data.translation;
                document.getElementById('downloadLink').href = data.download_link;
                document.getElementById('downloadLink').style.display = 'inline';
                document.getElementById('results').style.display = 'block';
              }
            })
            .catch(error => {
              alert('Error: ' + error);
            });
          };

          recorder.start();
        })
        .catch(error => {
          alert('Permission to access microphone denied.');
        });
    });

    stopRecordButton.addEventListener('click', () => {
      recorder.stop();
      audioStream.getTracks().forEach(track => track.stop());
      startRecordButton.disabled = false;
      stopRecordButton.disabled = true;
    });

    document.getElementById('readTranslation').addEventListener('click', () => {
      const translationText = document.getElementById('translation').innerText;
      const speech = new SpeechSynthesisUtterance(translationText);
      window.speechSynthesis.speak(speech);
    });
  </script>

</body>
</html>
